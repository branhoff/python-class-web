name: infra

# OpenTofu lifecycle for the live GCP environment (infra/). Every trigger runs a
# plan and shows it in the run summary. On main (and manual runs), `apply` waits
# for the `production` environment reviewer, then applies that exact saved plan,
# so what was reviewed is what runs. Keyless auth via Workload Identity Federation.
#
# Runs are serialized so they cannot collide. Live runs (main and manual) share
# one group and are never cancelled mid-flight; a newer one replaces any run still
# queued behind it. The apply job refuses a plan once a newer live run exists.
# Pull request runs only plan: each PR cancels its own older plan and plans
# without the state lock, so two PRs opened together do not collide on it.

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/actions/tofu-init/**']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/actions/tofu-init/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('infra-plan-{0}', github.ref) || 'infra-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: infra

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_identity_platform_api_key: ${{ vars.IDENTITY_PLATFORM_API_KEY }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SA_EMAIL: ${{ vars.DEPLOY_SA_EMAIL }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tofu-init
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: tofu plan -input=false -out=tfplan ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
      - name: Show the plan in the run summary
        run: |
          {
            echo '## OpenTofu plan'
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  apply:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tofu-init
      - name: Refuse a plan that a newer run has superseded
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/refuse-superseded-apply.sh
      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra
      - run: tofu apply -input=false tfplan
      - name: Redeploy main so a stale plan cannot leave an older image live
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/redeploy-main.sh
