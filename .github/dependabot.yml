# Keeps the (deliberately small) dependency surface patched. Add the ecosystem
# for your language (npm | pip | gomod | cargo | ...); delete what you don't use.
version: 2
updates:
  # One PR per ecosystem per week, so Dependabot does not open several infra
  # plans in the same second.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
